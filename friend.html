<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You are invited · TeachEd</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#1E2231;--lime:#D3F26A;--sand:#F6F6EF;--olive:#5D614B;--bg:#fff;--card:#F6F6EF}
@media (prefers-color-scheme:dark){:root{--ink:#F4F3EC;--sand:#2a2d3a;--olive:#b6b9a2;--bg:#14161f;--card:#1f2230}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px 16px}
.card{width:min(460px,100%);background:var(--card);border-radius:28px;padding:30px 28px;box-shadow:0 20px 50px -24px rgba(30,34,49,.35)}
.brand{font-weight:800;letter-spacing:-.4px;font-size:18px}.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lime);margin-right:7px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.6px;margin:18px 0 6px}p{margin:0 0 14px;color:var(--olive)}
.k{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--olive)}
input{width:100%;font:inherit;padding:13px 15px;border-radius:14px;border:1.5px solid rgba(30,34,49,.16);background:#fff;color:#1E2231;margin-bottom:10px;outline:none}input:focus{border-color:#9AB31F}
button,.btn{display:inline-block;width:100%;text-align:center;font:800 15px inherit;font-family:inherit;padding:14px 18px;border-radius:999px;border:0;background:var(--lime);color:#1E2231;cursor:pointer;text-decoration:none}
.ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(128,128,128,.35);margin-top:10px}
.err{color:#b23a0e;font-size:14px;min-height:20px;margin:0 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat{background:var(--bg);border-radius:18px;padding:14px 16px}.stat b{display:block;font-size:26px;letter-spacing:-.6px}.stat span{font-size:12px;color:var(--olive);font-weight:700}
.words{display:grid;gap:8px;margin:16px 0;max-height:300px;overflow:auto}.w{background:var(--bg);border-radius:14px;padding:10px 14px}.w b{display:block}.w span{font-size:13px;color:var(--olive)}
.fine{font-size:12.5px;color:var(--olive);margin-top:14px;text-align:center}
</style></head><body><main class="card" id="app"><div class="brand"><i></i>TeachEd</div><div id="body"><p>One moment…</p></div></main>
<script src="scripts/app-core.js"></script>
<script>

const A = window.TeachEdApp, BASE = A.API_BASE;
const $ = s => document.querySelector(s), q = new URLSearchParams(location.search);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tok = () => { try { return localStorage.getItem('teachedos_token'); } catch (_) { return null; } };
const call = (path, opt) => fetch(BASE + path, Object.assign({ headers: { 'Content-Type': 'application/json', ...(tok() ? { Authorization: 'Bearer ' + tok() } : {}) } }, opt, opt && opt.body ? { body: JSON.stringify(opt.body) } : {})).then(r => r.json().catch(() => ({})).then(d => ({ ok: r.ok, d })));
async function me() { if (!tok()) return null; const r = await call('/api/auth/me'); return r.ok ? (r.d.user || r.d) : null; }

const code = (q.get('c') || '').toLowerCase(), addToken = q.get('add') || '';
const body = $('#body');
const go = () => { location.href = 'student-hub.html' + (addToken ? '#wordbank' : '#friends'); };
async function accept() {
  const r = await call('/api/friends/accept', { method: 'POST', body: { code } });
  if (!r.ok) { body.innerHTML = '<h1>Hmm.</h1><p>' + esc(r.d.error || 'This invitation could not be used.') + '</p><a class="btn" href="student-hub.html">Open my hub</a>'; return false; }
  if (addToken) await call('/api/friends/shared/' + encodeURIComponent(addToken) + '/add', { method: 'POST' });
  return r.d;
}
(async () => {
  const info = await call('/api/friends/invite/' + encodeURIComponent(code));
  if (!info.ok) { body.innerHTML = '<h1>This invitation does not exist</h1><p>Ask your friend to send the link again.</p><a class="btn" href="index.html">Go to TeachEd</a>'; return; }
  const from = esc(info.d.from);
  const user = await me();
  if (user && user.role === 'student') { body.innerHTML = '<p>Adding ' + from + '…</p>'; if (await accept()) go(); return; }
  if (user) { body.innerHTML = '<h1>' + from + ' invited a student</h1><p>You are signed in as a teacher. Friends are for students: ask ' + from + ' to share a set of words with you instead.</p><a class="btn" href="index.html">Back to my boards</a>'; return; }
  let mode = 'join';
  const draw = () => {
    body.innerHTML = '<div class="k" style="margin-top:18px">' + from.toUpperCase() + ' INVITED YOU</div><h1>' + (mode === 'join' ? 'Learn English together with ' + from : 'Sign in to join ' + from) + '</h1>' +
      '<p>' + (mode === 'join' ? 'A free account takes a minute: your words, streak and duels - and ' + from + ' in your friends from the first day.' : 'Welcome back.') + '</p>' +
      (mode === 'join' ? '<input id="nm" placeholder="Your name" autocomplete="name">' : '') + '<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password' + (mode === 'join' ? ' (8+ characters)' : '') + '" autocomplete="' + (mode === 'join' ? 'new-password' : 'current-password') + '">' +
      '<div class="err" id="er" role="alert"></div><button id="go">' + (mode === 'join' ? 'Join ' + from : 'Sign in and join') + '</button>' +
      '<button class="ghost" id="sw">' + (mode === 'join' ? 'I already have an account' : 'I am new here') + '</button>' +
      '<div class="fine">Free for students. Friends only see your points, streak and shared sets - never your lessons.</div>';
    $('#sw').onclick = () => { mode = mode === 'join' ? 'login' : 'join'; draw(); };
    $('#go').onclick = async () => {
      const email = $('#em').value.trim(), password = $('#pw').value, er = $('#er');
      er.textContent = '';
      if (!email || !password) { er.textContent = 'Email and password, please.'; return; }
      $('#go').disabled = true;
      const r = mode === 'join'
        ? await call('/api/auth/register', { method: 'POST', body: { email, password, name: $('#nm').value.trim() || email.split('@')[0], role: 'student', acceptTerms: true } })
        : await call('/api/auth/login', { method: 'POST', body: { email, password } });
      if (!r.ok || !r.d.token) { er.textContent = r.d.error || 'That did not work. Check the details and try again.'; $('#go').disabled = false; return; }
      try { localStorage.setItem('teachedos_token', r.d.token); } catch (_) {}
      if (await accept()) go();
    };
  };
  draw();
})();
</script></body></html>
