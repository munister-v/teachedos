<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Anagram</title>
<link rel="stylesheet" href="ww.css?v=922">
<style>
/* Anagram: подсказка слева, справа буквы-плитки и строка ответа с
   прочерками. Буквы перетаскивают или тапают по порядку; пробел во фразе
   виден сразу и не угадывается. */
.an{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:16px;align-items:center}
.an-clue{text-align:center;font-weight:700;font-size:clamp(16px,3vw,23px);line-height:1.3;padding:8px}
.an-right{display:flex;flex-direction:column;align-items:center;gap:14px}
.an-letters,.an-answer{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:100%}
.an-l{width:clamp(28px,5.4vw,40px);height:clamp(34px,6.4vw,48px);display:flex;align-items:center;justify-content:center;border:0;border-radius:4px;
  background:#24282C;color:#fff;font-weight:800;font-size:clamp(17px,3.6vw,26px);box-shadow:inset 0 -4px 0 rgba(255,255,255,.14),0 2px 3px rgba(36,40,44,.25)}
.an-l.used{visibility:hidden}
/* Телефон: буква узкая по необходимости, но высокая под палец. */
@media (max-width:430px){.an-l{width:clamp(30px,8vw,40px);height:44px}}
.an-answer{padding:8px 10px;border:2px solid var(--gray);border-radius:6px;min-height:62px;align-items:flex-end}
.an-slot{width:clamp(28px,5.4vw,40px);height:clamp(34px,6.4vw,48px);display:flex;align-items:center;justify-content:center;border:0;border-bottom:4px solid var(--gray);background:none;font-weight:800;font-size:clamp(17px,3.6vw,26px);padding:0}
.an-slot.gap{width:14px;border:0}
.an-answer.ok{border-color:var(--ok);background:#EAF7EE}
.an-answer.bad{border-color:var(--bad)}
.an-reveal{font-weight:700;color:var(--olive);font-size:15px;min-height:20px}
@media (max-width:540px){.an{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:8px}}
</style>
</head>
<body>
<script src="ww.js?v=922"></script>
<script>
var DEMO=[{a:'fever',b:'a high body temperature'},{a:'cough',b:'a noisy push of air from your throat'},{a:'rash',b:'red spots on the skin'},{a:'sore throat',b:'pain when you swallow'}];
var ww=WW.init({template:'Anagram',instructions:'Drag the letters into the correct positions to unjumble the words.',timer:'up',score:true});
var items=[],deck=[],pos=0,state=[];
function mk(it){
  var letters=it.word.split('').filter(function(c){return c!==' ';});
  var sh=WW.shuffle(letters);var guard=0;while(sh.join('')===letters.join('')&&letters.length>1&&guard++<10)sh=WW.shuffle(letters);
  return{letters:sh,placed:[],used:[],done:null};
}
function render(){
  var it=deck[pos],st=state[pos];
  ww.stage.innerHTML='';
  var root=document.createElement('div');root.className='an';
  var clue=document.createElement('div');clue.className='an-clue';clue.textContent=it.meaning;
  var right=document.createElement('div');right.className='an-right';
  var L=document.createElement('div');L.className='an-letters';
  st.letters.forEach(function(ch,i){var b=document.createElement('button');b.className='an-l'+(st.used[i]?' used':'');b.textContent=ch;b.onclick=function(){put(i);};L.appendChild(b);});
  var A=document.createElement('div');A.className='an-answer'+(st.done==='ok'?' ok':st.done==='bad'?' bad':'');
  var k=0;it.word.split('').forEach(function(ch){
    if(ch===' '){var g=document.createElement('span');g.className='an-slot gap';A.appendChild(g);return;}
    var idx=k++;var s=document.createElement('button');s.className='an-slot';var pl=st.placed[idx];
    s.textContent=pl!=null?st.letters[pl]:'';s.onclick=function(){take(idx);};A.appendChild(s);
  });
  var rv=document.createElement('div');rv.className='an-reveal';rv.textContent=st.done==='bad'?('Answer: '+it.word):'';
  right.appendChild(L);right.appendChild(A);right.appendChild(rv);
  root.appendChild(clue);root.appendChild(right);ww.stage.appendChild(root);
  ww.setNav(pos,deck.length,function(){pos--;render();},function(){pos++;render();});
}
function need(){return deck[pos].word.replace(/ /g,'').length;}
function put(i){
  var st=state[pos];if(!ww.running||st.done||st.used[i])return;
  var slot=0;while(st.placed[slot]!=null)slot++;if(slot>=need())return;
  st.placed[slot]=i;st.used[i]=true;render();
  if(st.placed.filter(function(x){return x!=null;}).length===need())check();
}
function take(idx){var st=state[pos];if(st.done||st.placed[idx]==null)return;st.used[st.placed[idx]]=false;st.placed[idx]=null;render();}
function check(){
  var st=state[pos],it=deck[pos];
  var got=st.placed.map(function(i){return st.letters[i];}).join('').toLowerCase(),want=it.word.replace(/ /g,'').toLowerCase();
  st.done=got===want?'ok':'bad';ww.beep(st.done==='ok');if(st.done==='ok')ww.addScore(1);
  ww.progress(ww.score,deck.length);render();
  setTimeout(function(){
    var nx=state.findIndex(function(s){return !s.done;});
    if(nx<0){ww.finish({score:ww.score,max:deck.length,answers:deck.map(function(x,i){return{q:x.meaning,a:x.word,ok:state[i].done==='ok'};})});return;}
    pos=nx;render();
  },st.done==='ok'?800:1600);
}
ww.onStart=function(){deck=WW.shuffle(items);pos=0;state=deck.map(mk);render();};
window.applyCustomContent=function(content,title){
  var p=WW.pairsFrom(content).filter(function(x){return x.meaning&&/^[a-z][a-z' -]*$/i.test(x.word);});
  if(p.length<1)return;
  items=p;ww.setTitle(title||'Anagram');document.title=(title||'Anagram')+' · Anagram';ww.showStart();
};
window.applyCustomContent({pairs:DEMO},'Illness vocabulary');
WW.listen();
</script>
<script src="../../scripts/game-handoff.js?v=922"></script>
</body>
</html>
