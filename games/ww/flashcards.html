<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flash cards</title>
<link rel="stylesheet" href="ww.css?v=909">
<style>
/* Flash cards: одна большая карта; спереди значение, «Flip» - слово.
   После переворота справа ✓ / ✗ - ученик сам отмечает, знал ли. */
.fc{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:100%}
.fc-card{position:relative;width:min(78%,440px);aspect-ratio:3/2;max-height:100%;perspective:900px;cursor:pointer}
.fc-inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.fc-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;
  background:var(--c);color:var(--f);box-shadow:inset 0 -8px 0 rgba(36,40,44,.2),0 4px 8px rgba(36,40,44,.2)}
.fc-back{transform:rotateY(180deg)}
.fc-front .t{font-weight:700;font-size:clamp(17px,3.4vw,24px);line-height:1.3}
.fc-back .w{font-weight:800;font-size:clamp(28px,7vw,48px);line-height:1.05}
.fc-back .ex{font-weight:600;font-size:clamp(13px,2.2vw,16px);line-height:1.35;opacity:.92;max-width:92%}
.fc-say{margin-top:-2px}
.fc-marks{display:flex;flex-direction:column;gap:8px}
.fc-marks[hidden]{display:none}
.fc-marks button{width:46px;height:46px;border:0;border-radius:6px;color:#fff;font-size:24px;font-weight:900;box-shadow:inset 0 -4px 0 rgba(36,40,44,.25)}
.fc-yes{background:var(--ok)}.fc-no{background:var(--bad)}
.fc-marks button.on{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<script src="ww.js?v=909"></script>
<script>
var DEMO=[{a:'headache',b:'a pain in your head',example:'I have a terrible headache.'},{a:'fever',b:'a high body temperature'},{a:'cough',b:'to push air out of your throat with a noise'},{a:'rash',b:'red spots on the skin'}];
var ww=WW.init({template:'Flash cards',instructions:'Read the card, flip it and check yourself.',timer:'up',score:true,navTop:true,action:{label:'Flip'}});
var items=[],deck=[],pos=0,marks=[];
function render(){
  var it=deck[pos];
  ww.stage.innerHTML='';
  var root=document.createElement('div');root.className='fc';
  var card=document.createElement('div');card.className='fc-card';
  var inner=document.createElement('div');inner.className='fc-inner';
  var front=document.createElement('div');front.className='fc-face fc-front';front.innerHTML=it.img?'<img src="'+WW.esc(it.img)+'" alt="" style="max-width:90%;max-height:90%;object-fit:contain">':'<div class="t">'+WW.esc(it.meaning)+'</div>';
  var back=document.createElement('div');back.className='fc-face fc-back';
  back.innerHTML='<div class="w">'+WW.esc(it.word)+'</div>'+(it.audio?'<div class="fc-say">'+WW.sayBtn(it.audio)+'</div>':'')+(it.example?'<div class="ex">'+WW.esc(it.example)+'</div>':'');
  var f=ww.fill(pos);[front,back].forEach(function(n){n.style.setProperty('--c',f[0]);n.style.setProperty('--f',f[1]);});
  inner.appendChild(front);inner.appendChild(back);card.appendChild(inner);
  card.onclick=flip;
  var m=document.createElement('div');m.className='fc-marks';m.hidden=true;
  m.innerHTML='<button class="fc-yes" type="button" aria-label="I knew it">✓</button><button class="fc-no" type="button" aria-label="I did not know it">✗</button>';
  m.querySelector('.fc-yes').onclick=function(e){e.stopPropagation();mark(true);};
  m.querySelector('.fc-no').onclick=function(e){e.stopPropagation();mark(false);};
  if(marks[pos]!=null){m.hidden=false;m.querySelector(marks[pos]?'.fc-yes':'.fc-no').classList.add('on');}
  root.appendChild(card);root.appendChild(m);ww.stage.appendChild(root);
  ww.setNav(pos,deck.length,function(){pos--;render();},function(){pos++;render();});
  ww.setAction('Flip',flip);
}
function flip(){
  var c=ww.stage.querySelector('.fc-card');if(!c)return;
  c.classList.toggle('flipped');
  if(c.classList.contains('flipped'))ww.stage.querySelector('.fc-marks').hidden=false;
}
function mark(ok){
  if(!ww.running)return;
  if(marks[pos]==null&&ok)ww.addScore(1);
  else if(marks[pos]===true&&!ok)ww.addScore(-1);
  else if(marks[pos]===false&&ok)ww.addScore(1);
  marks[pos]=ok;ww.beep(ok);ww.progress(ww.score,deck.length);
  var next=marks.findIndex(function(x,i){return x==null&&i>pos;});
  if(next<0)next=marks.findIndex(function(x){return x==null;});
  if(next<0){ww.finish({score:ww.score,max:deck.length,answers:deck.map(function(x,i){return{q:x.word,a:x.meaning,ok:marks[i]};})});return;}
  setTimeout(function(){pos=next;render();},350);
}
ww.onStart=function(){deck=WW.shuffle(items);pos=0;marks=new Array(deck.length).fill(null);render();};
window.applyCustomContent=function(content,title){
  var p=WW.pairsFrom(content).filter(function(x){return x.meaning;});
  if(p.length<1)return;
  items=p;ww.setTitle(title||'Flash cards');document.title=(title||'Flash cards')+' · Flash cards';ww.showStart();
};
window.applyCustomContent({pairs:DEMO},'Illness vocabulary');
WW.listen();
</script>
<script src="../../scripts/game-handoff.js?v=909"></script>
</body>
</html>
