<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Speaking cards</title>
<link rel="stylesheet" href="ww.css?v=1069">
<style>
/* Speaking cards: колода рубашкой слева, сданная карта справа, снизу
   Shuffle / Undo / Deal. Карта - слово учителя и задание «скажи». */
.sc{display:flex;align-items:center;justify-content:center;gap:5%;width:100%;height:100%;padding-bottom:20px}
/* Карта считается от ВЫСОТЫ кадра: по ширине она помещалась, а по высоте
   вылезала за нижний край. */
.sc-deck,.sc-spot{position:relative;height:min(100%,calc((100vw - 40px) * 0.38 * 1.4));aspect-ratio:5/7;max-width:46%}
.sc-back{position:absolute;inset:0;border-radius:10px;background:#24282C;border:6px solid #CDF649}
.sc-back::after{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border:5px solid #CDF649;border-radius:6px}
.sc-deck .sc-back:nth-child(1){transform:translate(6px,6px)}
.sc-deck .sc-back:nth-child(2){transform:translate(3px,3px)}
.sc-count{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-weight:700;color:var(--olive);font-size:14px}
.sc-spot{border:3px dashed var(--gray);border-radius:10px}
.sc-card{position:absolute;inset:-3px;border-radius:10px;background:#fff;border:6px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;animation:sc-in .35s ease}
@keyframes sc-in{from{transform:translateX(-60%) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.sc-w{font-weight:800;font-size:clamp(20px,4.6vw,32px);line-height:1.05}
.sc-m{font-weight:600;color:var(--olive);font-size:clamp(12px,2.2vw,15px);line-height:1.3}
.sc-t{margin-top:4px;padding:7px 9px;border-radius:6px;background:var(--paper);font-weight:700;font-size:clamp(12px,2.2vw,15px);line-height:1.3}
.sc-reveal{border:2px dashed rgba(36,40,44,.3);background:var(--paper);border-radius:10px;padding:8px 14px;font:800 14px var(--font,sans-serif);color:#24282C;cursor:pointer}
.sc-reveal:hover{border-color:#CDF649;background:#F4FCD9}
.sc-ex{font-style:italic;font-size:clamp(12px,2vw,14px);color:#24282C;line-height:1.3}
.sc-card .ww-pron{font-size:12px;padding:2px 8px}
.sc-new{margin-top:2px;border:1px solid rgba(36,40,44,.2);background:#fff;border-radius:999px;padding:5px 12px;font:700 12px var(--font-ui,system-ui,sans-serif);color:#24282C;cursor:pointer}
.sc-new:hover{background:#CDF649;border-color:#CDF649}
.sc-btns{display:flex;gap:8px}
.sc-btns .ww-action{min-width:96px}
</style>
</head>
<body>
<script src="ww.js?v=1069"></script>
<script>
var DEMO=[{a:'headache',b:'a pain in your head'},{a:'fever',b:'a high body temperature'},{a:'cough',b:'a noisy push of air from your throat'},{a:'rash',b:'red spots on the skin'}];
var TASKS=['Use it in a sentence about yourself.','Explain it without saying the word.','Ask your partner a question with it.','Tell a 3-sentence story with it.','Say when you last had, saw or needed it.'];
/* Задание зависит от того, ЧТО за слово. «Give an example from real life» к
   «get expelled» или «educational journey» не подходит - поэтому пул свой у
   действий и фразовых глаголов (личный опыт, гипотетическая ситуация), у
   абстракций и устойчивых сочетаний (мнение), у предметов (описание,
   ассоциации, выбор), у прилагательных и у служебных слов. */
var POOLS={
  action:[
    'Tell about a real situation when "{w}" happened - to you or to someone you know.',
    'What would you do if "{w}" happened to you tomorrow? Use "{w}" in your answer.',
    'Act it out with your partner: one of you is in the situation, the other reacts.',
    'Make a short story of three sentences with "{w}" in the middle.',
    'Ask your partner: "When was the last time...?" using "{w}".'],
  idea:[
    'Do you agree that "{w}" matters in real life? Give your opinion and one reason.',
    'Is "{w}" mostly positive or negative for most people? Why?',
    'Explain "{w}" to a friend in your own words, then give one example from your life.',
    'Which is more important for you: "{w}" or the opposite idea? Defend your choice.',
    'Ask your partner an opinion question with "{w}".'],
  thing:[
    'Describe "{w}" in three sentences without saying the word - your partner guesses.',
    'Say three things you associate with "{w}".',
    'Would you rather have "{w}" or something else? Say what and why.',
    'Where would you find "{w}", and who uses it? Explain.',
    'Ask your partner a question about "{w}" - use who, when or how often.'],
  adjective:[
    'Describe a person, place or day that is "{w}". Say why.',
    'When did you last feel or see something "{w}"? Tell the story.',
    'Say the opposite of "{w}" and use both words in one sentence.',
    'Ask your partner: "Is your ... {w}?" and follow up.'],
  fn:[
    'Make three different sentences with "{w}" about your day.',
    'Say a sentence with "{w}" - your partner repeats it and adds one more.',
    'Correct this: say a wrong sentence with "{w}", then fix it.']
};
function kindOf(it){
  var m=String(it.meaning||'').toLowerCase(),pos=String(it.pos||'').toLowerCase(),w=String(it.word||'').toLowerCase();
  var multi=/\s/.test(w.trim());
  if(/preposition|article|conjunction|determiner|pronoun|modal/.test(pos)||/^used (before|to show|with|after)\b/.test(m))return 'fn';
  if(/verb/.test(pos)||/^to\s/.test(m)||(!/noun|adj/.test(pos)&&/^(be|get|take|make|do|go|come|step|put|set|give|turn|look|run|carry|break|bring|pick|find|hold|keep|let|take a|have|feel|fall|pay|cut|call|drop) /.test(w)))return 'action';
  if(/adj/.test(pos))return 'adjective';
  if(multi||/(tion|sion|ment|ness|ity|ship|ance|ence|ism|hood|dom)$/.test(w))return 'idea';
  return 'thing';
}
function tasksFor(it,i){
  var pool=POOLS[kindOf(it)]||[];
  var r=pool.length?i%pool.length:0;
  var rot=pool.slice(r).concat(pool.slice(0,r)).map(function(t){return t.replace(/\{w\}/g,function(){return it.word;});});
  var own=(it.tasks||[]).filter(Boolean);
  /* Первым - «объясни своими словами», значение открывается по Reveal:
     в уроке 1 на 1 это самое живое задание. */
  var all=['Explain "'+it.word+'" in your own words and give an example - then press Reveal to check.'].concat(own,rot);
  return all.length?all:TASKS;
}
var tIdx={},shown={};
var ww=WW.init({template:'Speaking cards',instructions:'Deal out random cards from a shuffled deck.',timer:'none',score:false,action:{label:'Deal'}});
var items=[],order=[],pos=-1;
/* Три кнопки вместо одной главной: Shuffle / Undo / Deal, как в референсе. */
(function(){
  var act=document.querySelector('.ww-action');var box=document.createElement('div');box.className='sc-btns';
  var sh=document.createElement('button');sh.className='ww-action';sh.textContent='Shuffle';sh.id='sc-shuffle';sh.onclick=function(){if(pos>=0)newTask();else reshuffle();};
  var un=document.createElement('button');un.className='ww-action';un.textContent='Undo';un.id='sc-undo';un.onclick=function(){if(pos>=0){pos--;render();}};
  act.parentNode.insertBefore(box,act);box.appendChild(sh);box.appendChild(un);box.appendChild(act);
})();
function newTask(){
  if(pos<0)return;var k=order[pos];var n=tasksFor(items[k],k).length;
  tIdx[k]=((tIdx[k]||0)+1)%n;render();
}
function reshuffle(){order=WW.shuffle(items.map(function(_,i){return i;}));pos=-1;render();}
function render(){
  ww.stage.innerHTML='';
  var root=document.createElement('div');root.className='sc';
  var deck=document.createElement('div');deck.className='sc-deck';
  var left=order.length-pos-1;
  if(left>0){deck.innerHTML='<div class="sc-back"></div>'+(left>1?'<div class="sc-back"></div>':'')+(left>2?'<div class="sc-back"></div>':'');}
  else deck.style.border='3px dashed var(--gray)',deck.style.borderRadius='10px';
  var cnt=document.createElement('div');cnt.className='sc-count';cnt.textContent=left+' left';deck.appendChild(cnt);
  deck.onclick=deal;
  var spot=document.createElement('div');spot.className='sc-spot';
  if(pos>=0){var it=items[order[pos]];var f=ww.fill(order[pos]);
    var lx=WW.lex(it.word)||{},open=!!shown[order[pos]];
    spot.innerHTML='<div class="sc-card" style="--c:'+f[0]+'"><div class="sc-w">'+WW.esc(it.word)+'</div>'+WW.pron(it.word,it.audio)+
      (it.meaning?(open?'<div class="sc-m">'+WW.esc(it.meaning)+'</div>'+(lx.example?'<div class="sc-ex">'+WW.esc(lx.example)+'</div>':''):'<button type="button" class="sc-reveal">👁 Reveal the meaning</button>'):'')+'<div class="sc-t">'+WW.esc(tasksFor(it,order[pos])[(tIdx[order[pos]]||0)%tasksFor(it,order[pos]).length])+'</div><button type="button" class="sc-new" title="A different speaking task for this word">↻ New task</button></div>';
    var nb=spot.querySelector('.sc-new');if(nb)nb.onclick=newTask;
    var rv=spot.querySelector('.sc-reveal');if(rv)rv.onclick=function(){shown[order[pos]]=1;render();};}
  root.appendChild(deck);root.appendChild(spot);ww.stage.appendChild(root);
  ww.setAction('Deal',deal,left<=0);
  var un=document.getElementById('sc-undo');if(un)un.disabled=pos<0;
  var shb=document.getElementById('sc-shuffle');if(shb)shb.textContent=pos>=0?'New task':'Shuffle';
}
function deal(){
  if(pos>=order.length-1)return;pos++;render();ww.progress(pos+1,order.length);
  if(pos===order.length-1)ww.post({type:'game-finished',score:order.length,max:order.length,game:'Speaking cards',status:'done'});
}
ww.onStart=reshuffle;
window.addEventListener('resize',function(){if(order.length)render();});
window.applyCustomContent=function(content,title){
  var p=WW.pairsFrom(content);
  if(p.length<1)return;
  var raw=(content&&(content.cards||content.pairs||content.items))||[],by={};
  raw.forEach(function(r){var k=String(r.a||r.word||r.w||r.term||r.en||'').trim().toLowerCase();if(k)by[k]=r;});
  p.forEach(function(it){var r=by[it.word.toLowerCase()]||{};it.pos=r.pos||'';it.tasks=Array.isArray(r.tasks)?r.tasks.map(String):(r.prompt?[String(r.prompt)]:[]);});
  tIdx={};shown={};
  items=p;ww.setTitle(title||'Speaking cards');document.title=(title||'Speaking cards')+' · Speaking cards';ww.showStart();
};
window.applyCustomContent({pairs:DEMO},'Illness vocabulary');
WW.listen();
</script>
<script src="../../scripts/game-handoff.js?v=1069"></script>
</body>
</html>
