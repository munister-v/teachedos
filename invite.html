<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24282C">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>TeachEd - Accept Invite</title>
<link rel="icon" type="image/png" href="logo-sm.png"/>
<link rel="stylesheet" href="styles/mobile.css?v=941">
<link rel="stylesheet" href="styles/harmony.css?v=941">
<link rel="stylesheet" href="styles/unify.css?v=941">
<link rel="stylesheet" href="styles/teached-brand.css?v=941">
<link rel="stylesheet" href="styles/figma-theme.css?v=941">
<link rel="stylesheet" href="styles/controls.css?v=941">
<link rel="stylesheet" href="styles/invite-page.css?v=941">
</head>
<body class="fx">
  <!-- A personal invite (admin -> teacher, or teacher -> student by email):
       the address and role are reserved, the person only picks a name and
       a password. Same ticket card as join.html. -->
  <main class="ip-card is-loading" id="card">
    <header class="ip-head">
      <div class="ip-top">
        <a class="ip-logo" href="/"><img src="logo-sm.png" alt="">TeachEd</a>
        <span class="ip-chip" id="chip">Invite</span>
      </div>
      <h1 class="ip-title" id="title">Finish your account</h1>
      <p class="ip-sub" id="sub">Checking the invitation…</p>
      <div class="ip-meta" id="meta"></div>
    </header>

    <section class="ip-body">
      <form class="ip-form" id="accept-form" hidden>
        <div>
          <label class="ip-label" for="name">Your name</label>
          <input class="input" id="name" type="text" placeholder="First and last name" autocomplete="name" required>
        </div>
        <div>
          <label class="ip-label" for="password">Password</label>
          <input class="input" id="password" type="password" maxlength="72" placeholder="10 or more characters" autocomplete="new-password" required>
        </div>
        <div>
          <label class="ip-label" for="password2">Repeat password</label>
          <input class="input" id="password2" type="password" maxlength="72" placeholder="The same once more" autocomplete="new-password" required>
        </div>
        <button class="ip-btn primary" id="submit-btn" type="submit">
          Create account
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="ip-actions" id="home" hidden>
        <a class="ip-btn primary" href="/?auth=login">Sign in to TeachEd</a>
      </div>
      <div class="ip-status" id="status" role="status" aria-live="polite"></div>
    </section>
    <footer class="ip-foot" id="foot">Already have an account? <a href="/?auth=login">Sign in</a></footer>
  </main>

<script>
const API = (window.TEACHED_API_BASE || ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:4000' : ((location.hostname === 'teached.tech' || location.hostname.endsWith('.teached.tech')) ? location.origin : 'https://teached.tech')));
const tokenParam = new URLSearchParams(location.search).get('token');
const $ = id => document.getElementById(id);
let inviteData = null;

function setStatus(text, kind) {
  $('status').textContent = text || '';
  $('status').className = 'ip-status' + (kind ? ' ' + kind : '');
}

/* «Failed to fetch» читается как поломка сайта; на деле это почти всегда сеть. */
function humanError(err) {
  const raw = String(err?.message || '');
  if (!raw || /failed to fetch|load failed|networkerror/i.test(raw)) return null;
  return raw;
}

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function roleLabel(role) {
  return role === 'student' ? 'Student' : role === 'admin' ? 'Admin' : 'Teacher';
}

function redirectForRole(role) {
  return role === 'student' ? 'student.html' : 'index.html';
}

function chip(text) {
  const el = document.createElement('span');
  el.textContent = text;
  return el;
}

function dead(title, message, offline) {
  $('card').classList.remove('is-loading');
  $('card').classList.add('is-dead');
  $('chip').textContent = offline ? 'Offline' : 'Invite closed';
  $('title').textContent = title;
  $('sub').textContent = message;
  $('accept-form').hidden = true;
  $('home').hidden = false;
  if (offline) $('home').innerHTML = '<button class="ip-btn primary" type="button" onclick="location.reload()">Try again</button>';
}

async function loadInvite() {
  if (!tokenParam) return dead('This link is incomplete', 'Open the whole link from your invitation email - part of it is missing.');
  try {
    const r = await fetch(`${API}/api/auth/invites/${encodeURIComponent(tokenParam)}`);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Invite not found');
    inviteData = d.invite;
    $('card').classList.remove('is-loading');
    $('chip').textContent = `${roleLabel(inviteData.role)} invite`;
    $('title').textContent = 'Finish your account';
    $('sub').textContent = inviteData.role === 'student'
      ? 'Your teacher invited you to TeachEd. Pick a name and a password - that is all.'
      : 'You were invited to teach on TeachEd. Pick a name and a password - that is all.';
    const meta = $('meta');
    meta.append(chip(inviteData.email));
    const board = /^Board:\s*(.+)$/.exec(inviteData.note || '');
    if (board) meta.append(chip(`Board: ${board[1]}`));
    if (inviteData.expires_at) meta.append(chip(`Valid until ${formatDate(inviteData.expires_at)}`));
    $('accept-form').hidden = false;
    setTimeout(() => $('name').focus(), 50);
  } catch (err) {
    const msg = humanError(err);
    if (!msg) return dead('Cannot reach TeachEd', 'Check your connection and reload the page - the invite itself is fine.', true);
    dead('This invite cannot be used', `${msg}. If you already created your account, just sign in. Otherwise ask for a new invitation.`);
  }
}

$('accept-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim();
  const password = $('password').value;
  const password2 = $('password2').value;
  if (!inviteData) return;
  if (!name || !password || !password2) return setStatus('Please fill in all three fields.', 'err');
  if (password !== password2) return setStatus('The passwords do not match.', 'err');
  if (password.length < 10) return setStatus('The password needs at least 10 characters.', 'err');

  const btn = $('submit-btn');
  btn.disabled = true;
  setStatus('Creating your account…');
  try {
    const r = await fetch(`${API}/api/auth/invites/${encodeURIComponent(tokenParam)}/accept`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Could not accept the invite');
    if (d.isNewUser) {
      const email = d.user?.email || 'anon';
      localStorage.setItem('teachedos_onboarding_pending', '1');
      localStorage.setItem('teachedos_onboarding_pending_' + email, '1');
    }
    localStorage.setItem('teachedos_token', d.token);
    localStorage.setItem('teachedos_role', d.user.role);
    if (d.user.email) localStorage.setItem('teachedos_user_email', d.user.email);
    localStorage.setItem('teachedos_user', JSON.stringify(d.user));
    setStatus('Account created - opening TeachEd…', 'ok');
    setTimeout(() => { location.href = redirectForRole(d.user.role); }, 700);
  } catch (err) {
    setStatus(humanError(err) || 'Network error - try again.', 'err');
  } finally {
    btn.disabled = false;
  }
});

loadInvite();
</script>
<script src="scripts/nav-boost.js?v=941" defer></script>
<script src="scripts/mobile-zoom-guard.js?v=941" defer></script>
</body>
</html>
