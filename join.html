<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F6EF">
<meta name="robots" content="noindex">
<title>TeachEd - Join the class</title>
<link rel="icon" type="image/png" href="logo-sm.png"/>
<link rel="stylesheet" href="styles/teached-brand.css?v=997">
<link rel="stylesheet" href="styles/auth.css?v=997">
<link rel="stylesheet" href="styles/invite-page.css?v=997">
</head>
<body>
  <!-- Where a teacher's join link lands: who invites you, to which board,
       what you get, one button. Sign-in / sign-up opens the shared auth
       modal right here, so the student never loses the link on the way. -->
  <main class="ip-card is-loading" id="card">
    <header class="ip-head">
      <div class="ip-top">
        <a class="ip-logo" href="/"><img src="logo-sm.png" alt="">TeachEd</a>
        <span class="ip-chip" id="chip">Class invite</span>
      </div>
      <div class="ip-from">
        <div class="ip-ava" id="ava">TE</div>
        <div class="ip-from-text" id="from"><b>Your teacher</b>invites you to the board</div>
      </div>
      <h1 class="ip-title" id="title">Loading the board</h1>
      <p class="ip-sub" id="sub" hidden></p>
    </header>

    <section class="ip-body">
      <ul class="ip-perks" id="perks">
        <li><span class="ip-perk-ic c1"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v5"/></svg></span>Your lessons and materials in one place</li>
        <li><span class="ip-perk-ic c2"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></span>Homework and quizzes - with your results</li>
        <li><span class="ip-perk-ic c3"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.5-.8z"/></svg></span>Free for students</li>
      </ul>

      <div class="ip-actions" id="guest" hidden>
        <button class="ip-btn primary" type="button" onclick="startAuth('register')">Create a free account</button>
        <button class="ip-btn ghost" type="button" onclick="startAuth('login')">I already have an account</button>
      </div>
      <div class="ip-actions" id="member" hidden>
        <button class="ip-btn primary" type="button" id="join-btn" onclick="joinBoard()">
          Join the board
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="ip-actions" id="home" hidden>
        <a class="ip-btn ghost" href="/">Go to TeachEd</a>
      </div>
      <div class="ip-status" id="status" role="status" aria-live="polite"></div>
    </section>
    <footer class="ip-foot" id="foot">Only people with this link can join. Already joined? It simply opens the board.</footer>
  </main>

<script>
const API = (window.TEACHED_API_BASE || ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:4000' : ((location.hostname === 'teached.tech' || location.hostname.endsWith('.teached.tech')) ? location.origin : 'https://teached.tech')));
const JOIN_TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);

function authToken() { try { return localStorage.getItem('teachedos_token') || ''; } catch { return ''; } }

function setStatus(text, kind) {
  $('status').textContent = text || '';
  $('status').className = 'ip-status' + (kind ? ' ' + kind : '');
}

function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0] || 'T') + (parts[1]?.[0] || '')).toUpperCase();
}

function showActions() {
  const signedIn = !!authToken();
  $('guest').hidden = signedIn;
  $('member').hidden = !signedIn;
}

function dead(message, offline) {
  $('card').classList.remove('is-loading');
  $('card').classList.add('is-dead');
  $('chip').textContent = offline ? 'Offline' : 'Link expired';
  $('title').textContent = offline ? 'Cannot reach TeachEd' : 'This link does not work';
  $('sub').textContent = message;
  $('sub').hidden = false;
  $('guest').hidden = $('member').hidden = true;
  $('home').hidden = false;
  if (offline) {
    $('home').innerHTML = '<button class="ip-btn primary" type="button" onclick="location.reload()">Try again</button>';
    $('foot').hidden = true;
  } else {
    $('foot').textContent = 'Teachers can make a new join link any time in Students → Add students.';
  }
}

async function loadInfo() {
  if (!JOIN_TOKEN) return dead('The link is incomplete - copy the whole link from your teacher and open it again.');
  try {
    const r = await fetch(`${API}/api/members/join/${encodeURIComponent(JOIN_TOKEN)}`);
    const d = await r.json().catch(() => ({}));
    if (r.status === 404) return dead('Your teacher may have made a new one. Ask them to send it again.');
    if (!r.ok) return dead(d.error || 'Ask your teacher for a new link.');
    $('card').classList.remove('is-loading');
    $('title').textContent = d.board.name || 'Your class board';
    $('ava').textContent = initials(d.teacher.name);
    $('from').innerHTML = '';
    const b = document.createElement('b');
    b.textContent = d.teacher.name;
    $('from').append(b, 'invites you to the board');
    document.title = `TeachEd - ${d.board.name || 'Join the class'}`;
    showActions();
  } catch {
    dead('Check your connection and reload the page - the link itself is fine.', true);
  }
}

async function joinBoard() {
  const btn = $('join-btn');
  btn.disabled = true;
  setStatus('Joining…');
  try {
    const r = await fetch(`${API}/api/members/join/${encodeURIComponent(JOIN_TOKEN)}`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + authToken() },
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) {
      // The saved session has expired - sign in again, the link waits here.
      try { localStorage.removeItem('teachedos_token'); } catch {}
      showActions();
      return setStatus('Your session has expired - sign in to join.', 'err');
    }
    if (!r.ok) return setStatus(d.error || `Could not join (HTTP ${r.status})`, 'err');
    setStatus(d.owner ? 'This is your own board - opening it.' : 'You are in! Opening the board…', 'ok');
    setTimeout(() => { location.href = `board.html?id=${encodeURIComponent(d.boardId)}`; }, 500);
  } catch {
    setStatus('Network error - try again.', 'err');
  } finally {
    btn.disabled = false;
  }
}

function startAuth(mode) {
  openAuthModal(mode);
  if (mode === 'register') selectAuthRole('student');
}

window.TEACHED_AUTH_CONFIG = {
  subtitle: () => 'Sign in to join the board',
  focusTrap: true,
  onSuccess: async (d) => {
    localStorage.setItem('teachedos_token', d.token);
    localStorage.setItem('teachedos_role', d.user.role);
    if (d.user.email) localStorage.setItem('teachedos_user_email', d.user.email);
    if (d.isNewUser) {
      localStorage.setItem('teachedos_onboarding_pending', '1');
      localStorage.setItem('teachedos_onboarding_pending_' + (d.user.email || 'anon'), '1');
    }
    closeAuthModal();
    showActions();
    await joinBoard();
  },
};

loadInfo();
</script>
<script src="scripts/auth-modal.js?v=997"></script>
<script src="scripts/mobile-zoom-guard.js?v=997" defer></script>
</body>
</html>
