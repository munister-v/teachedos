<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="An interactive illustrated wallpaper of Ukraine: every region, 28 cities and the country's folk treasures — tap a place to discover what it is famous for." />

if (/[?&]wall=1\b/.test(location.search)) document.documentElement.classList.add("is-wall");</script>

    <title>Interactive Wallpaper — Map of Ukraine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;700;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root{
        color-scheme: light;
      }
      *{ box-sizing:border-box; }
      html,body{ height:100%; }
      body{
        margin:0;
        font-family:"Rubik", system-ui, sans-serif;
        overflow:hidden;
        background:#173e7c;
      }

      /* ---------- stage ---------- */
      .stage{ position:fixed; inset:0; background:linear-gradient(180deg, var(--sky1), var(--sky2)); }
      .stage svg{ display:block; width:100%; height:100%; }
      .vignette{
        position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(6,20,48,.28) 100%);
      }

      /* ---------- poster palette (day / dusk) ---------- */
      body{
        --sky1:#2f63b0; --sky2:#1a4486;
        --land:#b9e2f2; --land-edge:#8ec9e6; --land-shadow:#123a75;
        --ink:#10355f;
        --label:#ffffff; --label-stroke:#17457c;
        --sun-core:#ffd83d; --sun-ray:#ffcf1f;
        --sea-line:rgba(255,255,255,.35);
        --cloud:#ffffff;
        --star-op:0;
        --moon-op:0; --sun-op:1;
        --window:#ffe9a3; --window-op:0;
      }
      body[data-theme="dusk"]{
        --sky1:#1d2c57; --sky2:#0d1734;
        --land:#7ea9cc; --land-edge:#5d8ab2; --land-shadow:#081226;
        --ink:#0d2142;
        --label:#eef5ff; --label-stroke:#0d2142;
        --sea-line:rgba(190,215,255,.30);
        --cloud:#aebfdd;
        --star-op:1;
        --moon-op:1; --sun-op:0;
        --window-op:1;
      }
      .sky{ fill:url(#skyGrad); }
      #skyGrad stop:first-child{ stop-color:var(--sky1); }
      #skyGrad stop:last-child{ stop-color:var(--sky2); }
      .land-shadow{ fill:var(--land-shadow); opacity:.55; }
      .land{ fill:var(--land); stroke:var(--land-edge); }
      .cloud{ fill:var(--cloud); opacity:.92; }
      .star{ fill:#fff; opacity:var(--star-op); transition:opacity 1s ease; }
      .sun-g{ opacity:var(--sun-op); transition:opacity .8s ease; }
      .moon-g{ opacity:var(--moon-op); transition:opacity .8s ease; }
      .win{ fill:var(--window); opacity:var(--window-op); transition:opacity 1s ease; }
      .sea-line{ stroke:var(--sea-line); }
      .city-label{
        fill:var(--label); stroke:var(--label-stroke);
        font-family:"Shantell Sans","Rubik",sans-serif; font-weight:700;
        paint-order:stroke; stroke-linejoin:round;
      }
      .title-letter{ fill:#ffd83d; stroke:#e8a90c; paint-order:stroke; stroke-linejoin:round;
        font-family:"Shantell Sans",sans-serif; font-weight:800; }
      /* ---------- interactive bits ---------- */
      .city, .landmark{ cursor:pointer; outline:none; }
      .city .dot{ fill:#10283f; stroke:#fff; stroke-width:2.5; transition:transform .25s ease; transform-box:fill-box; transform-origin:center; }
      .city:hover .dot, .city:focus .dot{ transform:scale(1.35); }
      .city .halo{ fill:none; stroke:#ffd83d; stroke-width:3; opacity:0; transform-box:fill-box; transform-origin:center; }
      .city.active .halo{ opacity:1; animation:haloPulse 1.6s ease-in-out infinite; }
      .landmark{ transition:filter .35s ease; }
      .landmark:hover, .landmark:focus{ filter:drop-shadow(0 0 8px rgba(255,216,61,.95)); }
      @keyframes haloPulse{ 0%,100%{ transform:scale(.8);} 50%{ transform:scale(1.25);} }

      .sway{ transform-box:fill-box; transform-origin:50% 100%; animation:sway 5s ease-in-out infinite; }
      .sway-slow{ animation-duration:7s; animation-delay:-2s; }
      @keyframes sway{ 0%,100%{ rotate:-2.4deg;} 50%{ rotate:2.4deg;} }
      .drift{ animation:drift 26s ease-in-out infinite alternate; }
      .drift2{ animation:drift 34s ease-in-out infinite alternate-reverse; }
      @keyframes drift{ from{ translate:-26px 0;} to{ translate:34px 0;} }
      .rays{ transform-box:fill-box; transform-origin:center; animation:spin 46s linear infinite; }
      @keyframes spin{ to{ rotate:360deg;} }
      .wave-move{ animation:waveMove 9s linear infinite; }
      .wave-move2{ animation:waveMove 14s linear infinite reverse; }
      @keyframes waveMove{ from{ transform:translateX(0);} to{ transform:translateX(-120px);} }
      .twinkle{ animation:twinkle 2.8s ease-in-out infinite; }
      @keyframes twinkle{ 0%,100%{ opacity:calc(var(--star-op) * .35);} 50%{ opacity:var(--star-op);} }
      .bob{ animation:bob 4.5s ease-in-out infinite; }
      @keyframes bob{ 0%,100%{ translate:0 0; rotate:-1deg;} 50%{ translate:0 -7px; rotate:1.5deg;} }

      /* ---------- chrome: one compact day/dusk toggle ---------- */
      .theme-toggle{
        position:fixed; top:14px; right:14px; z-index:20;
        width:46px; height:46px; border-radius:50%;
        appearance:none; border:0; cursor:pointer; padding:0;
        display:grid; place-items:center;
        color:#b97f06; background:rgba(255,253,244,.94);
        box-shadow:0 3px 0 rgba(16,45,90,.30), 0 8px 18px rgba(4,18,44,.32);
        transition:transform .15s ease, background .3s ease, color .3s ease;
        -webkit-touch-callout:none; user-select:none; -webkit-user-select:none;
      }
      .theme-toggle:hover{ transform:translateY(-1px); }
      .theme-toggle:active{ transform:translateY(1px); }
      .theme-toggle svg{ width:23px; height:23px; display:block; }
      .theme-toggle .ic-moon{ display:none; }
      body[data-theme="dusk"] .theme-toggle{ color:#ffd83d; background:rgba(16,32,66,.88); }
      body[data-theme="dusk"] .theme-toggle .ic-sun{ display:none; }
      body[data-theme="dusk"] .theme-toggle .ic-moon{ display:block; }
      .theme-toggle .auto-badge{
        position:absolute; right:-3px; bottom:-3px;
        min-width:17px; height:17px; padding:0 3px; border-radius:999px;
        background:#2e7d4f; color:#fff; border:2px solid #fffdf4;
        font-family:"Rubik",sans-serif; font-size:9.5px; font-weight:600; line-height:13px;
        display:none; place-items:center;
      }
      .theme-toggle.is-auto .auto-badge{ display:grid; }

      /* ---------- info card ---------- */
      .card{
        position:fixed; z-index:30; left:50%; bottom:22px; transform:translate(-50%, 24px);
        width:min(430px, calc(100vw - 28px));
        background:#fffdf4; color:#173a5e; border-radius:20px;
        padding:20px 22px 18px;
        box-shadow:0 24px 50px rgba(3,14,34,.45), 0 4px 0 #ffd83d inset;
        max-height:calc(100vh - 110px); overflow-y:auto;
        opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
      }
      .card.open{ opacity:1; pointer-events:auto; transform:translate(-50%, 0); }
      .card[hidden]{ display:none; }
      .card .tag{
        display:inline-block; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
        color:#8a6100; background:#ffedb3; padding:4px 10px; border-radius:999px; margin-bottom:9px;
      }
      .card h2{ margin:0 34px 6px 0; font-family:"Shantell Sans",sans-serif; font-weight:800; font-size:27px; line-height:1.1; }
      .card p{ margin:0; font-size:15px; line-height:1.55; color:#33536f; }
      .card .close{
        position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%;
        border:0; cursor:pointer; background:#eef3f8; color:#173a5e; font-size:17px; line-height:1;
        display:grid; place-items:center; transition:background .2s ease;
      }
      .card .close:hover{ background:#ffe9a3; }

      /* ---------- card art, facts, mark button ---------- */
      .card-art{
        margin:-20px -22px 14px; height:118px; border-radius:20px 20px 0 0;
        display:grid; place-items:center; background:#eaf2fb;
        transition:background .3s ease;
      }
      .card-art svg{ width:98px; height:98px; }
      .card .flabel{
        margin:10px 0 3px; font-size:11px; font-weight:600; letter-spacing:.12em;
        text-transform:uppercase; color:#8a6100;
      }
      .card .flabel:first-of-type{ margin-top:2px; }
      .card .facts{ margin:0; padding-left:19px; }
      .card .facts li{ font-size:14.5px; line-height:1.5; color:#33536f; margin:3px 0; }
      .markbtn{
        margin-top:14px; appearance:none; cursor:pointer;
        font-family:"Shantell Sans","Rubik",sans-serif; font-weight:700; font-size:14.5px;
        color:#173a5e; background:transparent; border:2px solid #173a5e; border-radius:999px;
        padding:8px 18px; transition:background .2s ease, transform .15s ease;
      }
      .markbtn:hover{ transform:translateY(-1px); }
      .markbtn[aria-pressed="true"]{ background:#ffd83d; border-color:#d9a50a; }
      .markbtn[hidden]{ display:none; }
      .visits{ margin:8px 0 0; font-size:12.5px; font-weight:500; color:#5d7287; }
      .visits[hidden]{ display:none; }

      /* ---------- back to the series (TeachEd · Meet Ukraine) ---------- */
      .series-back{
        position:fixed; top:14px; left:14px; z-index:20;
        display:inline-flex; align-items:center; gap:7px; height:46px; padding:0 18px 0 14px; border-radius:999px;
        font-family:"Shantell Sans","Rubik",sans-serif; font-weight:700; font-size:15px; text-decoration:none;
        color:#173a5e; background:rgba(255,253,244,.94);
        box-shadow:0 3px 0 rgba(16,45,90,.30), 0 8px 18px rgba(4,18,44,.32);
        transition:transform .15s ease, background .3s ease, color .3s ease;
      }
      .series-back:hover{ transform:translateY(-1px); }
      .series-back:focus-visible, .theme-toggle:focus-visible{ outline:3px solid #ffd83d; outline-offset:3px; }
      body[data-theme="dusk"] .series-back{ color:#eef5ff; background:rgba(16,32,66,.88); }

      /* ---------- map badges & marked state ---------- */
      .badge{ pointer-events:none; }
      .badge-shadow{ fill:rgba(6,20,48,.28); }
      .badge-bg{ fill:#ffffff; stroke-width:2.4; }
      .seal{ opacity:0; transition:opacity .25s ease; }
      .seal-bg{ fill:#f2b705; stroke:#ffffff; stroke-width:1.8; }
      .seal-star{ fill:#ffffff; }
      .city.marked .seal{ opacity:1; }
      .city.marked .dot{ fill:#f2b705; }

      @media (max-width:640px){
        .card{ bottom:12px; padding:17px 18px 15px; }
        .card h2{ font-size:23px; }
        .card-art{ margin:-17px -18px 12px; height:104px; }
        .card-art svg{ width:84px; height:84px; }
      }
      @media (prefers-reduced-motion: reduce){
        .sway,.drift,.drift2,.rays,.wave-move,.wave-move2,.twinkle,.bob,.city.active .halo{ animation:none !important; }
        .card,.theme-toggle,.series-back,.landmark,.city .dot{ transition:none !important; }
      }
    </style>
  </head>

    <script>
      (function(){
        "use strict";

        var CITIES = [
          { id:"uzhhorod", name:"Uzhhorod", x:172, y:435, lx:12, ly:5, anchor:"start", bx:170, by:464, accent:"#C94F7C", tint:"#FAE9F0",
            tag:"Zakarpattia · the far west",
            famous:"Uzhhorod is Ukraine's sakura city: every spring its streets turn pink with Japanese cherry blossom, and its castle watches over the river Uzh.",
            facts:["The city's sakura alley is one of the longest in Europe — the trees were planted in the 1920s–30s, when the city was part of Czechoslovakia.","An alley of linden trees along the Uzh River stretches about 2.2 km — often called the longest linden alley in Europe.","Uzhhorod is one of Ukraine's oldest cities, first mentioned in chronicles in the 9th century."] },
          { id:"lviv", name:"Lviv", x:279, y:329, lx:-12, ly:25, anchor:"end", bx:317, by:351, accent:"#B08A1E", tint:"#FAF1D7",
            tag:"Lviv region · the west",
            famous:"The Lviv Opera House, opened in 1900, is one of the most beautiful theatres in Europe — and Lviv is Ukraine's coffee capital, with coffee houses on every old-town corner.",
            facts:["Lviv's historic centre is a UNESCO World Heritage Site, with more than 2,000 architectural monuments.","The Opera House was built over the underground Poltva River — it still flows beneath the theatre today.","Lviv has over a hundred churches of different eras and styles packed into its old town."] },
          { id:"ivano", name:"Ivano-Frankivsk", x:322, y:408, lx:-12, ly:5, anchor:"end", bx:296, by:382, accent:"#B8860B", tint:"#F8F0DA",
            tag:"Prykarpattia · Carpathian gateway",
            famous:"The city's Ratusha (town hall) with its gilded dome watches over the old town — and Ivano-Frankivsk is the gateway to the Carpathian mountains.",
            facts:["The city was named after the writer Ivan Franko in 1962; before that it was called Stanislaviv (Stanisławów).","It was founded in 1662 as a fortress town and kept its neat star-shaped street plan.","The Ratusha is one of the few town halls in Ukraine built in the Art Deco style."] },
          { id:"ternopil", name:"Ternopil", x:378, y:354, lx:-12, ly:5, anchor:"end", bx:404, by:328, accent:"#2E8B74", tint:"#E4F2EE",
            tag:"Ternopil region · the west",
            famous:"Ternopil is built around a huge lake right in the city centre — the Ternopil Pond, with a green island in the middle and a castle on its shore.",
            facts:["The pond is artificial: it was created in the 16th century and covers more than 300 hectares.","The city was founded in 1540 by Jan Tarnowski, who also built the castle above the pond.","The little island in the pond is nicknamed the Island of Lovers."] },
          { id:"chernivtsi", name:"Chernivtsi", x:400, y:462, lx:12, ly:6, anchor:"start", bx:372, by:434, accent:"#A34A2A", tint:"#F7EAE2",
            tag:"Bukovina · the south-west",
            famous:"Chernivtsi University — the former Residence of Bukovinian Metropolitans — is a red-brick palace of patterned roofs and towers, now a UNESCO World Heritage Site.",
            facts:["In its Austrian era the city was nicknamed “Little Vienna” for its architecture and café culture.","The Residence took 18 years to build (1864–1882) and mixes Byzantine, Gothic and Baroque styles.","The poet Paul Celan, one of the great German-language poets, was born in Chernivtsi in 1920."] },
          { id:"lutsk", name:"Lutsk", x:361, y:251, lx:12, ly:5, anchor:"start", bx:331, by:221, accent:"#B3543F", tint:"#F9EAE4",
            tag:"Volyn · the north-west",
            famous:"Lubart's Castle, a mighty 14th-century brick fortress, is one of the best-preserved castles in Ukraine and the symbol of Lutsk.",
            facts:["In 1429 Lutsk hosted a congress of European monarchs — kings and princes gathered here to discuss the fate of the continent.","Lubart's Castle is pictured on Ukraine's 200-hryvnia banknote.","The poet Lesya Ukrainka spent part of her childhood in Lutsk, and her family home stood near the castle."] },
          { id:"rivne", name:"Rivne", x:420, y:263, lx:12, ly:5, anchor:"start", bx:446, by:237, accent:"#D9822B", tint:"#FBEBD9",
            tag:"Rivne region · the north-west",
            famous:"Rivne is the heart of Ukraine's amber country — the golden “sun stone” has been mined in this region for centuries.",
            facts:["The region's amber formed about 40 million years ago; the city even has its own Amber Museum.","Near the village of Klevan in Rivne region grows the famous Tunnel of Love — a green arch of trees over a railway, about 5 km long.","Rivne was first mentioned in 1283."] },
          { id:"khmelnytskyi", name:"Khmelnytskyi", x:467, y:366, lx:12, ly:-12, anchor:"start", bx:467, by:398, accent:"#B03A2E", tint:"#F9E9E6",
            tag:"Khmelnytskyi region · Podillia",
            famous:"The Khmelnytskyi region is crowned by the Kamianets-Podilskyi Fortress, a medieval castle standing on a rocky island in the Smotrych River canyon — and the city itself is famous across Ukraine for its enormous clothing market.",
            facts:["The Kamianets-Podilskyi Fortress guarded these lands for over 500 years and is counted among the Seven Wonders of Ukraine.","The city's clothing market is one of the largest in Europe, employing tens of thousands of people.","The city was renamed in honour of Hetman Bohdan Khmelnytsky in 1954; before that it was called Proskuriv."] },
          { id:"zhytomyr", name:"Zhytomyr", x:574, y:294, lx:12, ly:5, anchor:"start", bx:548, by:268, accent:"#4A6FA5", tint:"#E8EEF6",
            tag:"Zhytomyr region · Polissia",
            famous:"Zhytomyr is a space city: Serhiy Korolev, the chief designer behind the first satellite and the first human spaceflight, was born here.",
            facts:["Korolev was born in Zhytomyr in 1907; the city's Museum of Cosmonautics bears his name and holds real spacecraft.","Zhytomyr is one of Ukraine's oldest cities — tradition dates its founding to 884.","The city stands above the Teteriv River, whose granite cliffs are a favourite climbing spot."] },
          { id:"vinnytsia", name:"Vinnytsia", x:561, y:382, lx:0, ly:30, anchor:"middle", bx:522, by:384, accent:"#35708F", tint:"#E7F1F7",
            tag:"Vinnytsia region · Podillia",
            famous:"The Roshen Fountain on the Southern Buh — a floating fountain that dances with light and music — is the pride of Vinnytsia.",
            facts:["Opened in 2011, it is the largest floating fountain in Europe.","The great surgeon Mykola Pirogov lived at his Vyshnia estate here; his preserved body rests in a church-mausoleum nearby.","The city's 1912 water tower, topped with a clock, is a beloved Vinnytsia symbol."] },
          { id:"kyiv", name:"Kyiv", x:691, y:277, lx:16, ly:6, anchor:"start", bx:688, by:313, accent:"#C9930A", tint:"#FBF0CE",
            tag:"The capital",
            famous:"Kyiv, the capital, rises over the Dnipro River: the Independence Monument towers above Maidan Square, and St Sophia's Cathedral keeps its 11th-century frescoes under golden domes.",
            facts:["St Sophia's Cathedral and the Kyiv-Pechersk Lavra are UNESCO World Heritage Sites; the Lavra was founded in 1051.","Kyiv Metro's Arsenalna station lies about 105 metres underground — among the deepest metro stations in the world.","Legend says Kyiv was founded by three brothers — Kyi, Shchek and Khoryv — and their sister Lybid."] },
          { id:"chernihiv", name:"Chernihiv", x:740, y:187, lx:12, ly:26, anchor:"start", bx:712, by:159, accent:"#2E7D4F", tint:"#E6F2E9",
            tag:"Chernihiv region · the north",
            famous:"Chernihiv is a treasury of ancient Rus architecture — white-stone cathedrals and churches that have stood for a thousand years.",
            facts:["The Transfiguration Cathedral, founded around 1030, is considered the oldest surviving cathedral of Kyivan Rus.","Roughly a third of all Ukraine's preserved monuments from the 11th–13th centuries are in Chernihiv.","Anthony's Caves, an underground monastery founded in 1069 by St Anthony of the Caves, burrow beneath the Boldyni Hills."] },
          { id:"sumy", name:"Sumy", x:962, y:238, lx:-12, ly:5, anchor:"end", bx:926, by:212, accent:"#8A5A1F", tint:"#F7EDDD",
            tag:"Sumy region · the north-east",
            famous:"Sumy's symbol is the Altanka — a lacy openwork gazebo in the city centre — and the city grew rich on sugar.",
            facts:["Legend says the Altanka was built over a well drilled in search of oil; no oil was found, so a gazebo crowned the spot instead.","Sugar magnate Ivan Kharitonenko turned Sumy into a sugar capital and funded much of its grand architecture.","The city was founded by Cossacks in 1652 on the banks of the Psel River."] },
          { id:"kharkiv", name:"Kharkiv", x:1053, y:317, lx:16, ly:6, anchor:"start", bx:1083, by:343, accent:"#2F7FB8", tint:"#E7F3FC",
            tag:"Kharkiv region · the north-east",
            famous:"Kharkiv is known for Derzhprom, the constructivist giant on Freedom Square, and for the Mirror Stream fountain splashing under its openwork gazebo.",
            facts:["Freedom Square is one of the largest city squares in Europe.","Derzhprom, built in 1925–1928, was the first Soviet skyscraper and an icon of constructivism.","Kharkiv was the capital of Soviet Ukraine from 1919 to 1934."] },
          { id:"poltava", name:"Poltava", x:946, y:351, lx:12, ly:5, anchor:"start", bx:920, by:325, accent:"#C96A1E", tint:"#F9EDDF",
            tag:"Poltava region · on the Vorskla",
            famous:"Poltava is the capital of galushky — soft Ukrainian dumplings — honoured here with a monument and a festival; the city also gave its name to a famous battle.",
            facts:["The Battle of Poltava in 1709 was the decisive clash of the Great Northern War between Peter I and Charles XII of Sweden.","Ivan Kotlyarevsky, whose “Eneida” (1798) launched modern Ukrainian literature, was born in Poltava.","A giant bowl of galushky with a spoon stands as a monument in the city centre."] },
          { id:"cherkasy", name:"Cherkasy", x:788, y:364, lx:-12, ly:5, anchor:"end", bx:762, by:392, accent:"#C13B7E", tint:"#FAEAF1",
            tag:"Cherkasy region · on the Dnipro",
            famous:"Cherkasy stands on the wide Kremenchuk Reservoir and is home to the White Lotus — the largest Buddhist temple in Europe.",
            facts:["The White Lotus temple was built in the 1990s, modelled on a temple in Laos.","The Kremenchuk Reservoir, on whose shore the city stands, is the largest reservoir on the Dnipro.","Taras Shevchenko, Ukraine's national poet, was born in the village of Moryntsi in Cherkasy region."] },
          { id:"kropyvnytskyi", name:"Kropyvnytskyi", x:800, y:443, lx:-14, ly:6, anchor:"end", bx:796, by:403, accent:"#A87C0A", tint:"#F8F0DA",
            tag:"Kirovohrad region · the steppe centre",
            famous:"Kropyvnytskyi is Ukraine's theatre city: the first Ukrainian professional theatre troupe was founded here.",
            facts:["In 1882 actor and playwright Marko Kropyvnytskyi founded the first Ukrainian professional theatre here; the city now bears his name.","Few Ukrainian cities have been renamed so often: Yelysavethrad, Zinovievsk, Kirovo, Kirovohrad — and Kropyvnytskyi since 2016.","The city grew around the fortress of St Elizabeth, founded in 1754."] },
          { id:"dnipro", name:"Dnipro", x:977, y:447, lx:-14, ly:-6, anchor:"end", bx:1005, by:419, accent:"#2E6DA4", tint:"#E4EFF8",
            tag:"Dnipropetrovsk region · on the Dnipro",
            famous:"Dnipro stretches along the great river under one of Europe's longest embankments — and it is Ukraine's rocket city, building spacecraft at the Yuzhmash plant.",
            facts:["The embankment runs for over 20 kilometres along the Dnipro.","Yuzhmash built Zenit rockets and satellites launched around the world.","The Merefa–Kherson Bridge, opened in 1932, is one of the longest railway arch bridges in Europe."] },
          { id:"kryvyi", name:"Kryvyi Rih", x:872, y:495, lx:0, ly:30, anchor:"middle", bx:844, by:467, accent:"#B3543F", tint:"#F9EAE4",
            tag:"Iron & steel country",
            famous:"Kryvyi Rih is a city of iron: it stretches along one of the world's richest iron-ore basins, its mines and steelworks supplying the whole country.",
            facts:["It is one of the longest cities in Europe, running for more than 100 kilometres along the ore deposits.","The Kryvbas basin is among the largest iron-ore regions in the world.","The city has a unique “metrotram” — a high-speed tram that runs partly underground like a metro."] },
          { id:"zaporizhzhia", name:"Zaporizhzhia", x:985, y:501, lx:14, ly:22, anchor:"start", bx:1013, by:473, accent:"#8A5A1F", tint:"#F7EDDD",
            tag:"Zaporizhzhia region · Cossack heartland",
            famous:"Below the city lies Khortytsia, the largest island on the Dnipro and the heart of the Zaporozhian Cossack Sich — and the mighty DniproHES dam spans the river here.",
            facts:["Khortytsia is about 12 kilometres long — the biggest river island in Ukraine.","DniproHES, completed in 1932, was one of the largest hydroelectric stations in Europe at the time.","The Cossacks of the Sich are remembered for their legendary defiant letter to the Ottoman Sultan."] },
          { id:"mykolaiv", name:"Mykolaiv", x:783, y:575, lx:-12, ly:-14, anchor:"end", bx:811, by:549, accent:"#1F6E8C", tint:"#E2F1F6",
            tag:"Mykolaiv region · city of shipbuilders",
            famous:"Mykolaiv is a city of shipbuilders, standing where the Southern Buh meets the Inhul — its shipyards have launched vessels for more than two centuries.",
            facts:["The city was founded in 1789 as a shipyard settlement by Prince Potemkin.","The Black Sea Shipyard here built the Soviet Union's aircraft carriers.","Mykolaiv Zoo, founded in 1901, is one of the oldest and largest zoos in Ukraine."] },
          { id:"kherson", name:"Kherson", x:823, y:604, lx:12, ly:6, anchor:"start", bx:851, by:578, accent:"#3E8E4F", tint:"#E9F3EA",
            tag:"Kherson region · the south",
            famous:"Kherson is Ukraine's watermelon capital — barges carry the region's famous striped harvest up the Dnipro to Kyiv.",
            facts:["Kherson region grows a huge share of Ukraine's watermelons; the late-summer watermelon barge to Kyiv is a beloved tradition.","The city was founded in 1778 as a fortress and the first shipyard of the Black Sea fleet.","The Oleshky Sands near Kherson form one of the largest sand expanses in Europe."] },
          { id:"odesa", name:"Odesa", x:704, y:617, lx:-6, ly:32, anchor:"middle", bx:672, by:595, accent:"#D9822B", tint:"#FBEBD9",
            tag:"Odesa region · Black Sea port",
            famous:"The Potemkin Stairs — 192 steps — lead from Odesa down to the Black Sea; from the top you see only the landings, from the bottom only the steps, so the staircase seems endless.",
            facts:["Beneath the city stretch the Odesa catacombs — a labyrinth of roughly 2,500 kilometres, among the longest in the world.","The Odesa Opera and Ballet Theatre is considered one of the most beautiful opera houses in Europe.","The city was founded in 1794 on the site of the fortress of Khadjibey."] },
          { id:"donetsk", name:"Donetsk", x:1152, y:487, lx:16, ly:6, anchor:"start", bx:1124, by:459, accent:"#D7263D", tint:"#FBE7EA",
            tag:"Donetsk region · the east",
            famous:"Donetsk was called the city of a million roses — roses were planted in its parks, squares and even around the black spoil tips of the mines.",
            facts:["The city was founded in 1869 by Welsh businessman John Hughes and was first named Yuzovka after him.","The Donbass Arena, opened in 2009, hosted matches of UEFA Euro 2012.","Donetsk grew around coal mines and steelworks in the heart of the Donbas coal basin."] },
          { id:"luhansk", name:"Luhansk", x:1242, y:438, lx:0, ly:-16, anchor:"middle", bx:1214, by:462, accent:"#E08A00", tint:"#FBF0DA",
            tag:"Luhansk region · the far east",
            famous:"Luhansk is Ukraine's easternmost regional capital — the sun rises here earlier than in any other big city in the country — and a famed locomotive-building city.",
            facts:["The Luhansk locomotive works was one of the largest locomotive builders in Europe.","The city began in 1795 around an iron foundry established by British industrialist Charles Gascoigne.","Because of its position, Luhansk sees the sunrise more than half an hour before Kyiv."] },
          { id:"mariupol", name:"Mariupol", x:1136, y:564, lx:-6, ly:34, anchor:"middle", bx:1162, by:538, accent:"#C1272D", tint:"#F9E8E8",
            tag:"Port on the Sea of Azov",
            famous:"Mariupol is a sea gate and steel city on the warm Sea of Azov, watched over by its old lighthouse.",
            facts:["The Sea of Azov is the shallowest sea in the world — its average depth is only about seven metres.","Mariupol was founded by Greek settlers who moved here from Crimea in 1778–1780, and a large Greek community still lives in the area.","The city's steelworks made Mariupol one of Ukraine's biggest metal producers and its largest Azov port."] },
          { id:"simferopol", name:"Simferopol", x:917, y:749, lx:0, ly:-15, anchor:"middle", bx:883, by:749, accent:"#C96A1E", tint:"#F9EDDF",
            tag:"Crimea · the capital",
            famous:"Simferopol, the capital of Crimea, is the start of the famous mountain trolleybus road to the sea at Yalta.",
            facts:["The Simferopol–Yalta trolleybus line, opened in 1959, is the longest trolleybus route in the world — some 86 kilometres over the mountains to the sea.","Within the modern city lie the ruins of Scythian Naples, capital of the late Scythian state.","Simferopol was founded in 1784 near the Crimean Tatar town of Aqmescit."] },
          { id:"sevastopol", name:"Sevastopol", x:880, y:777, lx:-14, ly:8, anchor:"end", bx:880, by:807, accent:"#5B7C99", tint:"#E8EFF5",
            tag:"Crimea · Black Sea",
            famous:"Sevastopol spreads around one of the finest natural harbours on the Black Sea; in the bay stands its symbol — a white column on a rock crowned by an eagle, the Monument to the Sunken Ships.",
            facts:["The monument was erected in 1905, for the 50th anniversary of the city's defence in the Crimean War.","The ruins of ancient Chersonesus, a Greek city founded over 2,500 years ago, are a UNESCO World Heritage Site.","Sevastopol's shoreline is cut by more than 30 bays and coves."] }
        ];

        var EXTRA = {
          carpathians:{ tag:"Mountains of the south-west", title:"The Carpathians", icon:"mountains", tint:"#E4EFF8",
            famous:"Green mountains in the west of Ukraine. Hoverla, the country's highest peak at 2,061 metres, rises here, and lynxes and brown bears still roam the forests. This is Hutsul country — land of trembita horns and patterned woollen lizhnyk blankets.",
            facts:["The trembita, the Hutsul alpine horn up to four metres long, once carried messages and music from peak to peak — its voice travels for kilometres.","Hutsul lizhnyky — thick patterned woollen blankets — are still woven on wooden looms in mountain villages."] },
          borscht:{ tag:"A taste of Ukraine", title:"Borscht", icon:"borscht", tint:"#FBEEDD",
            famous:"Beetroot, cabbage, a spoon of sour cream and garlic pampushky on the side — borscht is the signature dish of Ukrainian cuisine.", facts:["In 2022 UNESCO listed the culture of Ukrainian borscht as intangible cultural heritage in need of urgent safeguarding."] },
          fields:{ tag:"The breadbasket", title:"Fields & tractors", icon:"tractor", tint:"#FBF3D3",
            famous:"Ukraine is a breadbasket of Europe: rich black earth covers much of the country, and its wheat and sunflowers travel the world. The sunflower is the country's unofficial flower.", facts:["Ukraine has long been the world's largest exporter of sunflower oil.","The rich black soil — chernozem — is so fertile that farmers say a stick planted in it would sprout."] },
          crimea:{ tag:"Crimea · the southern coast", title:"Swallow's Nest", icon:"nest", tint:"#E8EFF5",
            famous:"A miniature castle on the sheer Aurora Cliff near Yalta, built in 1912 — the Swallow's Nest is the most recognisable postcard view of Crimea.", facts:["The castle is tiny — just 20 metres long and 12 metres tall — balanced on a 40-metre cliff above the sea.","It was built for the oil industrialist Baron von Steingel and modelled on a romantic knight's castle."] },
          rushnyk:{ tag:"Folk embroidery · all Ukraine", title:"The Rushnyk", icon:"rushnyk", tint:"#FDF3E3",
            famous:"A rushnyk is a long embroidered ritual towel. It welcomes honoured guests with bread and salt, blesses weddings and icons — and its red ornaments are read like a family's story told in stitches.",
            facts:["Red is the classic rushnyk colour — a symbol of life, love and the sun; black adds the earth and memory.","At a Ukrainian wedding the couple stands on a rushnyk — whoever steps on it first is jokingly said to lead the family.","Bread and salt are still served on a rushnyk to honoured guests — a ritual of hospitality centuries old."] },
          petrykivka:{ tag:"Dnipropetrovsk region · Petrykivka village", title:"Petrykivka Painting", icon:"petrykivka", tint:"#FDECEA",
            famous:"In the village of Petrykivka, artists paint lush flowers and berries with brushes made of cat hair — and even with their fingertips. The style grew out of decorating village house walls and dowry chests.",
            facts:["In 2013 UNESCO added Petrykivka decorative painting to its Representative List of the Intangible Cultural Heritage of Humanity.","The kalyna — the guelder-rose berry cluster — is its signature motif, a symbol of family and immortality.","Traditional brushes are made from cat fur; drawing a hair-thin line in one stroke is a master's signature skill."] },
          pysanka:{ tag:"Hutsul country · Kolomyia", title:"The Pysanka", icon:"pysanka", tint:"#F9E9E6",
            famous:"A pysanka is an Easter egg written in hot wax and dye, line by line, with symbols older than Christianity — suns, stars, wheat and endless lines for eternity. The Hutsul town of Kolomyia is its capital.",
            facts:["Kolomyia's Pysanka Museum is shaped like a giant Easter egg, about 13.5 metres tall, and holds thousands of pysanky from all over Ukraine.","Artists write pysanky with a kistka — a tiny funnel that pours hot beeswax in fine lines before each dip in dye.","An old legend says that while people keep writing pysanky, good will keep winning over evil in the world."] },
          vyshyvanka:{ tag:"Poltava region · Reshetylivka", title:"White-on-White Embroidery", icon:"vyshyvanka", tint:"#F1F4F8",
            famous:"In Reshetylivka, Poltava region, masters embroider white thread on white linen — an ornament you can only see when the light plays across the stitches. It is Ukraine's most refined embroidery technique.",
            facts:["There is no printed pattern: the embroiderer counts every single thread of the linen as she works.","A single festive shirt can take several months of hand work and combine counted-thread, cutwork and drawn-thread techniques.","White embroidery was celebration dress in Poltava region — worn for weddings and the biggest holidays."] },
          borshchiv:{ tag:"Ternopil region · the Borshchiv land", title:"The Black Shirt", icon:"borshchiv", tint:"#F3EDE8",
            famous:"In the Borshchiv land of Ternopil region, women embroidered with black wool — dense, dark patterns with sudden bursts of colour, unlike the shirts of any other Ukrainian region.",
            facts:["Legend ties the black thread to mourning: after a Tatar raid killed the region's men, its women vowed to embroider in black for generations.","The heavy wool thread gives Borshchiv shirts their raised, almost sculpted ornament.","The town of Borshchiv celebrates its black-embroidered shirt with a festival of the vyshyvanka."] },
          pottery:{ tag:"Poltava region · Opishnia", title:"Opishnia Pottery", icon:"pottery", tint:"#F9EDDF",
            famous:"Opishnia in Poltava region has been a pottery capital for centuries. Its clay jugs, bowls and whistles travel to fairs across Ukraine, painted in the flowing floral style of nearby Bubnivka.",
            facts:["Ukraine's National Museum of Pottery stands in Opishnia.","Bubnivka-style painting covers brown clay with milky-white and blue flowers drawn in one flowing line.","Clay whistles shaped as rams, horses and birds are the region's traditional toys."] },
          locomotive:{ tag:"Luhansk region · the far east", title:"The Luhansk Locomotive", icon:"locomotive", tint:"#E9F0EA",
            famous:"For more than a century Luhansk built locomotives. Its great works sent steam and diesel engines far beyond Ukraine — and an old steam locomotive still stands in the city as a monument to its builders.",
            facts:["The Luhansk locomotive works was founded in 1896 by the German industrialist Gustav Hartmann and grew into one of Europe's largest locomotive builders.","The works grew on the site of the 1795 iron foundry — the very foundry around which the city of Luhansk began."] }
        };

        var svg = document.getElementById("poster");
        var NS = "http://www.w3.org/2000/svg";

        /* ---- build city markers ---- */
        function starPoints(cx, cy, ro, ri){
          var pts = [];
          for (var i=0;i<10;i++){
            var r = (i%2===0) ? ro : ri;
            var a = -Math.PI/2 + i*Math.PI/5;
            pts.push((cx + r*Math.cos(a)).toFixed(1) + "," + (cy + r*Math.sin(a)).toFixed(1));
          }
          return pts.join(" ");
        }
        var citiesG = document.getElementById("cities");
        CITIES.forEach(function(c){
          var g = document.createElementNS(NS,"g");
          g.setAttribute("class","city");
          g.setAttribute("tabindex","0");
          g.setAttribute("role","button");
          g.setAttribute("data-city", c.id);
          g.setAttribute("aria-label", c.name);
          var halo = document.createElementNS(NS,"circle");
          halo.setAttribute("class","halo"); halo.setAttribute("cx",c.x); halo.setAttribute("cy",c.y); halo.setAttribute("r","14.5");
          var dot = document.createElementNS(NS,"circle");
          dot.setAttribute("class","dot"); dot.setAttribute("cx",c.x); dot.setAttribute("cy",c.y); dot.setAttribute("r","7");
          var label = document.createElementNS(NS,"text");
          label.setAttribute("class","city-label");
          label.setAttribute("x", c.x + c.lx); label.setAttribute("y", c.y + c.ly);
          label.setAttribute("text-anchor", c.anchor);
          label.setAttribute("font-size","17"); label.setAttribute("stroke-width","4");
          label.textContent = c.name;
          g.appendChild(halo); g.appendChild(dot); g.appendChild(label);
          /* symbol badge next to the city */
          var badge = document.createElementNS(NS,"g");
          badge.setAttribute("class","badge");
          badge.setAttribute("transform","translate("+c.bx+","+c.by+")");
          var bsh = document.createElementNS(NS,"circle");
          bsh.setAttribute("class","badge-shadow"); bsh.setAttribute("cx","1.5"); bsh.setAttribute("cy","3"); bsh.setAttribute("r","13.5");
          var bbg = document.createElementNS(NS,"circle");
          bbg.setAttribute("class","badge-bg"); bbg.setAttribute("r","13.5"); bbg.setAttribute("stroke", c.accent);
          var buse = document.createElementNS(NS,"use");
          buse.setAttribute("href","#icon-"+c.id);
          buse.setAttribute("transform","translate(-11.5,-11.5) scale(0.319)");
          var seal = document.createElementNS(NS,"g");
          seal.setAttribute("class","seal"); seal.setAttribute("transform","translate(10,-10)");
          var sc = document.createElementNS(NS,"circle");
          sc.setAttribute("class","seal-bg"); sc.setAttribute("r","6.5");
          var sp = document.createElementNS(NS,"polygon");
          sp.setAttribute("class","seal-star"); sp.setAttribute("points", starPoints(0,0,3.9,1.7));
          seal.appendChild(sc); seal.appendChild(sp);
          badge.appendChild(bsh); badge.appendChild(bbg); badge.appendChild(buse); badge.appendChild(seal);
          g.appendChild(badge);
          citiesG.appendChild(g);
        });

        /* ---- generous invisible hit areas (dot + label / whole icon) ---- */
        function addHitArea(g){
          try{
            var bb = g.getBBox();
            var r = document.createElementNS(NS,"rect");
            r.setAttribute("x", (bb.x - 5).toFixed(1)); r.setAttribute("y", (bb.y - 5).toFixed(1));
            r.setAttribute("width", (bb.width + 10).toFixed(1)); r.setAttribute("height", (bb.height + 10).toFixed(1));
            r.setAttribute("fill", "#ffffff"); r.setAttribute("opacity", "0");
            g.insertBefore(r, g.firstChild);
          }catch(e){ /* element not laid out yet — clicks still land on shapes */ }
        }
        svg.querySelectorAll(".city, .landmark").forEach(addHitArea);

        /* ---- stars ---- */
        var starsG = document.getElementById("stars");
        var seed = 42;
        function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
        for (var i=0;i<70;i++){
          var s = document.createElementNS(NS,"circle");
          s.setAttribute("class","star" + (i%3===0 ? " twinkle":""));
          s.setAttribute("cx", (rnd()*1440).toFixed(0));
          s.setAttribute("cy", (rnd()*560).toFixed(0));
          s.setAttribute("r", (1 + rnd()*1.9).toFixed(1));
          if (i%3===0) s.style.animationDelay = (-rnd()*3).toFixed(1)+"s";
          starsG.appendChild(s);
        }

        /* ---- info card ---- */
        var card = document.getElementById("card"),
            cardTag = document.getElementById("cardTag"),
            cardTitle = document.getElementById("cardTitle"),
            cardText = document.getElementById("cardText"),
            cardUse = document.getElementById("cardUse"),
            cardArt = document.getElementById("cardArt"),
            cardFacts = document.getElementById("cardFacts"),
            factsWrap = document.getElementById("factsWrap");
        var activeCity = null;

        var hideTimer = null;
        function showCard(tag, title, famous, facts, icon, tint){
          if (hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
          cardTag.textContent = tag;
          cardTitle.textContent = title;
          cardText.textContent = famous;
          cardUse.setAttribute("href", "#icon-" + icon);
          cardArt.style.background = tint || "#eaf2fb";
          cardFacts.innerHTML = "";
          if (facts && facts.length){
            factsWrap.style.display = "";
            facts.forEach(function(f){
              var li = document.createElement("li");
              li.textContent = f;
              cardFacts.appendChild(li);
            });
          } else {
            factsWrap.style.display = "none";
          }
          card.hidden = false;
          requestAnimationFrame(function(){
            requestAnimationFrame(function(){ card.classList.add("open"); });
          });
        }
        function scheduleHide(){
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(function(){ card.hidden = true; hideTimer = null; }, 330);
        }
        function hideCard(){
          card.classList.remove("open");
          scheduleHide();
          if (activeCity){
            activeCity.classList.remove("active");
            activeCity = null;
          }
        }
        document.getElementById("cardClose").addEventListener("click", hideCard);
        document.addEventListener("keydown", function(e){
          if (e.key === "Escape") hideCard();
        });

        function cityById(id){
          for (var j=0;j<CITIES.length;j++) if (CITIES[j].id===id) return CITIES[j];
          return null;
        }
        function openCity(id){
          var c = cityById(id);
          if (activeCity) activeCity.classList.remove("active");
          var el = svg.querySelector('.city[data-city="'+id+'"]');
          if (el){ el.classList.add("active"); activeCity = el; }
          currentId = id;
          markBtn.hidden = false;
          if (c) showCard(c.tag, c.name, c.famous, c.facts, c.id, c.tint);
          refreshMarkUI();
        }
        function openExtra(key){
          var x = EXTRA[key];
          if (!x) return;
          if (activeCity){ activeCity.classList.remove("active"); activeCity = null; }
          currentId = null;
          markBtn.hidden = true;
          showCard(x.tag, x.title, x.famous, x.facts, x.icon, x.tint);
        }

        /* ---- mark as visited (from the city card); remembered on this device ---- */
        var VISITED_KEY = "teached_meet_ukraine_map_visited";
        var currentId = null;
        var marked = {};
        try { (JSON.parse(localStorage.getItem(VISITED_KEY) || "[]") || []).forEach(function(id){ if (cityById(id)) marked[id] = true; }); } catch(e){}
        Object.keys(marked).forEach(function(id){
          var el = svg.querySelector('.city[data-city="'+id+'"]');
          if (el) el.classList.add("marked");
        });
        var markBtn = document.getElementById("markBtn");
        var visitsEl = document.getElementById("visits");
        function refreshMarkUI(){
          var isM = !!(currentId && marked[currentId]);
          markBtn.setAttribute("aria-pressed", isM ? "true" : "false");
          markBtn.textContent = isM ? "★ Visited" : "☆ Mark as visited";
          var n = Object.keys(marked).length;
          visitsEl.hidden = !currentId || !n;
          visitsEl.textContent = n === CITIES.length ? "You have visited all " + n + " cities!" : "You have visited " + n + " of " + CITIES.length + " cities.";
        }
        function toggleMark(id){
          if (marked[id]) delete marked[id]; else marked[id] = true;
          try { localStorage.setItem(VISITED_KEY, JSON.stringify(Object.keys(marked))); } catch(e){}
          var el = svg.querySelector('.city[data-city="'+id+'"]');
          if (el) el.classList.toggle("marked", !!marked[id]);
          refreshMarkUI();
        }
        markBtn.addEventListener("click", function(){ if (currentId) toggleMark(currentId); });
        refreshMarkUI();

        svg.addEventListener("click", function(e){
          var t = e.target.closest ? e.target.closest("[data-city]") : null;
          if (!t) return;
          var id = t.getAttribute("data-city");
          if (EXTRA[id]) openExtra(id); else openCity(id, false);
        });
        svg.addEventListener("keydown", function(e){
          if (e.key !== "Enter" && e.key !== " ") return;
          var t = e.target.closest ? e.target.closest("[data-city]") : null;
          if (!t) return;
          e.preventDefault();
          var id = t.getAttribute("data-city");
          if (EXTRA[id]) openExtra(id); else openCity(id, false);
        });

        /* ---- theme: day/dusk follows the local clock automatically;
                the one compact toggle overrides it, long-press (or double-tap)
                returns to automatic ---- */
        var themeToggle = document.getElementById("themeToggle");
        var themeMode = "auto"; /* "auto" | "day" | "dusk" */
        function autoIsDusk(){
          var h = new Date().getHours();
          return h >= 19 || h < 7;
        }
        function applyTheme(){
          var dusk = themeMode === "auto" ? autoIsDusk() : themeMode === "dusk";
          document.body.setAttribute("data-theme", dusk ? "dusk" : "day");
          themeToggle.classList.toggle("is-auto", themeMode === "auto");
          themeToggle.setAttribute("aria-label",
            themeMode === "auto"
              ? "Theme: automatic — currently " + (dusk ? "dusk" : "day") + " by your local time. Tap to switch manually; long-press to stay automatic."
              : "Theme: " + (dusk ? "dusk" : "day") + " (manual). Tap to switch; long-press to return to automatic.");
        }
        applyTheme();
        /* re-check the clock so dusk falls by itself at 19:00 and lifts at 07:00 */
        setInterval(function(){ if (themeMode === "auto") applyTheme(); }, 30000);
        var pressTimer = null, longPressed = false;
        themeToggle.addEventListener("pointerdown", function(){
          longPressed = false;
          if (pressTimer) clearTimeout(pressTimer);
          pressTimer = setTimeout(function(){
            longPressed = true;
            themeMode = "auto";
            applyTheme();
          }, 600);
        });
        ["pointerup","pointerleave","pointercancel"].forEach(function(ev){
          themeToggle.addEventListener(ev, function(){
            if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
          });
        });
        themeToggle.addEventListener("contextmenu", function(e){ e.preventDefault(); });
        themeToggle.addEventListener("click", function(){
          if (longPressed){ longPressed = false; return; }
          var dusk = document.body.getAttribute("data-theme") !== "dusk";
          themeMode = dusk ? "dusk" : "day";
          applyTheme();
        });
        themeToggle.addEventListener("dblclick", function(){
          themeMode = "auto";
          applyTheme();
        });

        /* ---- no cursor parallax: the whole scene stays perfectly still
                under the pointer, so nothing slides out from under the mouse
                and hover states never flicker ---- */

        /* ---- fit: whole poster on portrait screens, fill on landscape ---- */
        function fitPoster(){
          var ratio = window.innerWidth / window.innerHeight;
          svg.setAttribute("preserveAspectRatio", ratio < 1.05 ? "xMidYMid meet" : "xMidYMid slice");
        }
        fitPoster();
        window.addEventListener("resize", fitPoster);

        /* highlight Kyiv by default so the poster feels alive */
        setTimeout(function(){
          var el = svg.querySelector('.city[data-city="kyiv"]');
          if (el){ el.classList.add("active"); activeCity = el; }
        }, 600);
      })();
    </script>
  </body>
</html>
