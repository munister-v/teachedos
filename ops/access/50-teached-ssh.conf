# /etc/ssh/sshd_config.d/50-teached.conf
# A shell on this machine must not become a tunnel into the other projects'
# localhost-only services (Postgres, admin APIs, push servers).
Match User teached
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
