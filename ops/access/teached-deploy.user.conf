# /etc/systemd/system/teached-deploy.service.d/user.conf
# Auto-deploy runs as `teached` too: whoever can push `main` gets the
# privileges of this user only, not root.
[Service]
User=teached
Group=teached
UMask=0022
Environment=LOCK=/opt/teachedos/.deploy.lock
Environment=BACKUPS=/opt/teachedos/deploy-backups
